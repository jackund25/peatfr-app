<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" role="img" aria-label="Gambut terbakar saat air di dalamnya turun; Peatfr meramalkannya lebih dulu">
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8A939B"/>
    </marker>
  </defs>

  <!-- Penampang lahan -->
  <rect x="24" y="20" width="712" height="70" fill="#EEF2F5"/>
  <rect x="24" y="90" width="712" height="170" fill="#C9A27A" fill-opacity="0.22"/>
  <path d="M24 100C250 105 450 160 736 235L736 260L24 260Z" fill="#2E78B7" fill-opacity="0.22"/>
  <path d="M24 100C250 105 450 160 736 235" fill="none" stroke="#2E78B7" stroke-width="2"/>
  <line x1="24" x2="736" y1="90" y2="90" stroke="#8A939B" stroke-width="1.25"/>
  <rect x="24" y="20" width="712" height="240" rx="8" fill="none" stroke="#8A939B" stroke-width="1.25"/>

  <!-- Sisi basah: awan hujan dan pohon -->
  <ellipse cx="300" cy="34" rx="28" ry="10" fill="#D5DADF" stroke="#8A939B"/>
  <ellipse cx="284" cy="30" rx="14" ry="9" fill="#D5DADF"/>
  <g stroke="#2E78B7" stroke-width="2"><line x1="288" x2="285" y1="48" y2="58"/><line x1="300" x2="297" y1="48" y2="60"/><line x1="312" x2="309" y1="48" y2="58"/></g>
  <g>
    <rect x="127" y="64" width="6" height="26" fill="#8A939B"/><circle cx="130" cy="54" r="16" fill="#4E9A5B" fill-opacity="0.35" stroke="#4E9A5B"/>
    <rect x="173" y="64" width="6" height="26" fill="#8A939B"/><circle cx="176" cy="54" r="16" fill="#4E9A5B" fill-opacity="0.35" stroke="#4E9A5B"/>
    <rect x="219" y="64" width="6" height="26" fill="#8A939B"/><circle cx="222" cy="54" r="16" fill="#4E9A5B" fill-opacity="0.35" stroke="#4E9A5B"/>
  </g>

  <!-- Sisi kering: matahari, rumput kering, api -->
  <circle cx="700" cy="44" r="14" fill="#E3B23C" fill-opacity="0.5" stroke="#E3B23C"/>
  <g stroke="#E3B23C" stroke-width="1.5" fill="none">
    <path d="M546 90L540 72M550 90L552 70M554 90L562 74"/>
    <path d="M584 90L578 74M588 90L590 72M592 90L598 76"/>
  </g>
  <path d="M640 90C628 78 636 66 644 54C646 68 658 72 652 90Z" fill="#C0392B" fill-opacity="0.75"/>
  <path d="M656 90C650 82 654 74 660 68C662 78 668 80 664 90Z" fill="#E3B23C" fill-opacity="0.85"/>
  <circle cx="648" cy="40" r="6" fill="#D5DADF"/><circle cx="656" cy="28" r="8" fill="#D5DADF"/>

  <!-- Sensor -->
  <line x1="400" x2="400" y1="54" y2="188" stroke="#1F2933" stroke-width="1.5"/>
  <rect x="392" y="40" width="16" height="14" rx="2" fill="#1F5F8B" fill-opacity="0.3" stroke="#1F5F8B"/>
  <circle cx="400" cy="143" r="4" fill="#2E78B7"/>
  <text x="414" y="51" font-size="11.5" fill="#1F2933">Sensor muka air tanah</text>

  <!-- Ambang -->
  <g stroke="#C0392B" stroke-width="1.25" stroke-dasharray="5 4">
    <line x1="24" x2="736" y1="170" y2="170"/><line x1="24" x2="736" y1="210" y2="210"/>
  </g>
  <text x="34" y="164" font-size="11.5" font-weight="600" fill="#1F2933">40 cm: bahaya tinggi mulai</text>
  <text x="34" y="204" font-size="11.5" font-weight="600" fill="#1F2933">60 cm: area terbakar terjadi</text>

  <text x="240" y="106" font-size="11.5" fill="#5B6670">muka air tanah</text>
  <text x="470" y="118" font-size="11.5" fill="#1F2933">Gambut kering di atas muka air</text>
  <text x="34" y="250" font-size="11.5" fill="#1F2933">Air tanah: gambut jenuh air</text>
  <text x="170" y="280" font-size="11.5" fill="#5B6670">Musim hujan: muka air dekat permukaan</text>
  <text x="736" y="280" text-anchor="end" font-size="11.5" fill="#5B6670">Kemarau: muka air turun, gambut siap terbakar</text>

  <!-- Alur Peatfr -->
  <path d="M88 262V302" stroke="#8A939B" stroke-width="1.25" fill="none" marker-end="url(#panah)"/>
  <text x="96" y="286" font-size="11.5" fill="#5B6670">data harian</text>
  <g stroke="#8A939B" stroke-width="1.25" fill="none">
    <path d="M150 356H170" marker-end="url(#panah)"/><path d="M296 356H316" marker-end="url(#panah)"/>
    <path d="M442 356H462" marker-end="url(#panah)"/><path d="M588 356H608" marker-end="url(#panah)"/>
  </g>

  <rect x="26" y="304" width="124" height="104" rx="8" fill="none" stroke="#8A939B" stroke-width="1.25"/>
  <text x="38" y="328" font-weight="600" fill="#1F2933">Data lapangan</text>
  <text x="38" y="344" font-size="11.5" fill="#1F2933">Muka air tanah</text>
  <text x="38" y="360" font-size="11.5" fill="#1F2933">Kelembapan tanah</text>
  <text x="38" y="376" font-size="11.5" fill="#1F2933">Curah hujan</text>
  <text x="38" y="392" font-size="11.5" fill="#1F2933">Suhu udara</text>

  <rect x="172" y="304" width="124" height="104" rx="8" fill="none" stroke="#8A939B" stroke-width="1.25"/>
  <text x="184" y="328" font-weight="600" fill="#1F2933">1. Imputasi</text>
  <text x="184" y="344" font-size="11.5" fill="#1F2933">Isi data sensor</text>
  <text x="184" y="360" font-size="11.5" fill="#1F2933">yang bolong</text>
  <text x="184" y="376" font-size="11.5" fill="#5B6670">KNN, spline,</text>
  <text x="184" y="392" font-size="11.5" fill="#5B6670">linear, LOESS</text>

  <rect x="318" y="304" width="124" height="104" rx="8" fill="none" stroke="#8A939B" stroke-width="1.25"/>
  <text x="330" y="328" font-weight="600" fill="#1F2933">2. Peramalan</text>
  <text x="330" y="344" font-size="11.5" fill="#1F2933">Ramal 4 variabel</text>
  <text x="330" y="360" font-size="11.5" fill="#1F2933">ke depan dengan</text>
  <text x="330" y="376" font-size="11.5" fill="#5B6670">ARIMA, LSTM,</text>
  <text x="330" y="392" font-size="11.5" fill="#5B6670">atau GRU</text>

  <rect x="464" y="304" width="124" height="104" rx="8" fill="none" stroke="#8A939B" stroke-width="1.25"/>
  <text x="476" y="328" font-weight="600" fill="#1F2933">3. Indeks PFVI</text>
  <text x="476" y="344" font-size="11.5" fill="#1F2933">Hitung kerawanan</text>
  <text x="476" y="360" font-size="11.5" fill="#1F2933">dari ramalan</text>
  <text x="476" y="376" font-size="11.5" fill="#5B6670">dikalibrasi</text>
  <text x="476" y="392" font-size="11.5" fill="#5B6670">otomatis</text>

  <rect x="610" y="304" width="124" height="104" rx="8" fill="#1F5F8B" fill-opacity="0.10" stroke="#1F5F8B" stroke-width="2"/>
  <text x="620" y="328" font-weight="600" fill="#1F2933">Kelas risiko</text>
  <rect x="620" y="335" width="12" height="10" rx="2" fill="#4E9A5B" fill-opacity="0.75"/><text x="638" y="344" font-size="11" fill="#1F2933">Rendah 0–75</text>
  <rect x="620" y="351" width="12" height="10" rx="2" fill="#E3B23C" fill-opacity="0.5"/><text x="638" y="360" font-size="11" fill="#1F2933">Sedang 76–150</text>
  <rect x="620" y="367" width="12" height="10" rx="2" fill="#E07A2F" fill-opacity="0.85"/><text x="638" y="376" font-size="11" fill="#1F2933">Tinggi 151–225</text>
  <rect x="620" y="383" width="12" height="10" rx="2" fill="#C0392B" fill-opacity="0.9"/><text x="638" y="392" font-size="11" font-weight="600" fill="#1F2933">Ekstrem 226–300</text>

  <text x="24" y="446" font-size="11.5" fill="#5B6670">Hasilnya menunjukkan di mana patroli dan pembasahan ulang perlu didahulukan; keputusan tetap di tangan petugas.</text>
</svg>
